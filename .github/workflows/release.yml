      - id: production_data
        name: Resolve production detail requirement
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler d1 execute PROD_DB --remote --json --env="" --config .release/verify/wrangler.jsonc --command "SELECT COUNT(*) AS count FROM repositories" > .release/production-count.json
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";
          const payload = JSON.parse(await readFile(".release/production-count.json", "utf8"));
          const count = payload?.[0]?.results?.[0]?.count;
          if (!Number.isSafeInteger(count) || count < 0) throw new Error("production_count_invalid");
          await appendFile(process.env.GITHUB_OUTPUT, `require_detail=${count > 0 ? "true" : "false"}\n`);
          NODE
      - name: Run production read-only smoke
        env:
          PRODUCTION_SMOKE_PIN: ${{ secrets.PRODUCTION_SMOKE_PIN }}
          RELEASE_REQUIRE_DETAIL: ${{ steps.production_data.outputs.require_detail }}
        run: RELEASE_BASE_URL="https://$PRODUCTION_HOST" RELEASE_ID="$GITHUB_SHA" RELEASE_PIN="$PRODUCTION_SMOKE_PIN" RELEASE_MODE="read-only" npx playwright test test/e2e/release-smoke.spec.js --project=chromium --retries=0
      - name: Verify production health and compressed assets
        run: |
          node --input-type=module <<'NODE'
          const base = new URL(`https://${process.env.PRODUCTION_HOST}/`);
          const health = await fetch(new URL("/health", base));
          let healthBody;
          try { healthBody = await health.json(); } catch { healthBody = null; }
          if (health.status !== 200 || healthBody?.status !== "ok" ||
              healthBody?.releaseId !== process.env.GITHUB_SHA) throw new Error("production_health_mismatch");
          const login = await fetch(new URL("/login", base), { headers: { "Accept-Encoding": "gzip, br" } });
          const text = await login.text();
          if (login.headers.get("cache-control") !== "no-store" ||
              !["br", "gzip"].includes(login.headers.get("content-encoding")) ||
              !login.headers.get("vary")?.toLowerCase().includes("accept-encoding"))
            throw new Error("production_html_headers_invalid");
          const asset = text.match(new RegExp(`/assets/${process.env.GITHUB_SHA}/favicon\\.svg`))?.[0];
          if (!asset) throw new Error("production_release_asset_missing");
          const response = await fetch(new URL(asset, base), { headers: { "Accept-Encoding": "gzip, br" } });
          if (!response.ok || response.headers.get("content-type") !== "image/svg+xml" ||
              !response.headers.get("cache-control")?.includes("immutable") ||
              !["br", "gzip"].includes(response.headers.get("content-encoding")) ||
              !response.headers.get("vary")?.toLowerCase().includes("accept-encoding"))
            throw new Error("production_asset_headers_invalid");
          NODE
      - name: Verify exact deployment and telemetry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deployments status --json --env="" --config .release/verify/wrangler.jsonc > .release/deployment-status.json
          node -e "const p=require('./.release/deployment-status.json');if(p?.versions?.length!==1||p.versions[0].version_id!==process.env.WORKER_VERSION_ID||p.versions[0].percentage!==100)throw Error('production_version_mismatch')"
          npx wrangler d1 execute PROD_DB --remote --json --env="" --config .release/verify/wrangler.jsonc --command "SELECT event_type,dimension,SUM(count) AS count FROM telemetry_daily WHERE release_id='$GITHUB_SHA' AND (event_type='client_error' OR event_type='csp_violation') GROUP BY event_type,dimension" > .release/production-telemetry.json
          node -e "const p=require('./.release/production-telemetry.json');const r=p?.[0]?.results;if(!Array.isArray(r)||r.some(x=>x.count>0))throw Error('production_telemetry_errors')"
      - name: Reverify immutable publication payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(tr -d '\r\n' < .release/archive.sha256)" = "$ARCHIVE_SHA256"
          for subject in ".release/repo-atlas-$GITHUB_SHA.tar.gz" .release/payload/release-manifest.json .release/deployment-record.json; do
            BUNDLE=.release/source-attestation.json
            [[ "$subject" = .release/deployment-record.json ]] && BUNDLE=.release/record-attestation.json
            gh attestation verify "$subject" --bundle "$BUNDLE" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA" --source-ref refs/heads/main --deny-self-hosted-runners
          done
          node scripts/release.mjs verify --dir .release/payload --record .release/deployment-record.json --archive ".release/repo-atlas-$GITHUB_SHA.tar.gz"
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const [record, metadata] = await Promise.all([
            readFile(".release/deployment-record.json", "utf8").then(JSON.parse),
            readFile(".release/payload/release-metadata.json", "utf8").then(JSON.parse),
          ]);
          if (record.releaseId !== process.env.GITHUB_SHA || metadata.releaseId !== process.env.GITHUB_SHA ||
              record.archiveSha256 !== process.env.ARCHIVE_SHA256 ||
              record.sourceAttestationId !== process.env.SOURCE_ATTESTATION_ID ||
              record.workerVersionId !== process.env.WORKER_VERSION_ID ||
              metadata.productionHost !== process.env.PRODUCTION_HOST || metadata.schema !== 2 ||
              record.temporaryRelaxation !== metadata.temporaryRelaxation ||
              record.temporaryRelaxation !== (process.env.TEMPORARY_RELAXATION === "true") ||
              metadata.temporaryRelaxation !== (process.env.TEMPORARY_RELAXATION === "true"))
            throw new Error("publication_payload_identity_mismatch");
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repo-atlas-${{ github.sha }}
          path: |
            .release/repo-atlas-${{ github.sha }}.tar.gz
            .release/archive.sha256
            .release/deployment-record.json
            .release/payload/release-manifest.json
            .release/payload/licenses.json
            .release/payload/sbom.cdx.json
            .release/payload/artifacts/test-summary.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - name: Recheck immutable GitHub Releases before publication
        env:
          RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/immutable-releases`, {
            headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${process.env.RELEASE_ADMIN_TOKEN}` },
          });
          let body;
          try { body = await response.json(); } catch { body = null; }
          if (response.status !== 200 || body?.enabled !== true) throw new Error("immutable_releases_disabled");
          NODE
      - name: Publish immutable known-good release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "/repos/$GITHUB_REPOSITORY/releases?per_page=100" > .release/publication-releases.json
          node -e "const p=require('./.release/publication-releases.json');if(!Array.isArray(p)||p.some(x=>!Array.isArray(x)))throw Error('release_list_invalid');if(p.flat().some(x=>x?.tag_name==='repo-atlas-'+process.env.GITHUB_SHA))throw Error('candidate_tag_reserved')"
          node --input-type=module <<'NODE'
          const tag = `repo-atlas-${process.env.GITHUB_SHA}`;
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/git/ref/tags/${tag}`, {
            headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${process.env.GH_TOKEN}` },
          });
          if (response.status === 404) process.exit(0);
          if (!response.ok) throw new Error("tag_ref_lookup_failed");
          throw new Error("tag_ref_preexisting");
          NODE
          gh release create "repo-atlas-$GITHUB_SHA" ".release/repo-atlas-$GITHUB_SHA.tar.gz" .release/archive.sha256 .release/deployment-record.json .release/payload/release-manifest.json .release/payload/licenses.json .release/payload/sbom.cdx.json .release/payload/artifacts/test-summary.json --target "$GITHUB_SHA" --title "Repo Atlas $GITHUB_SHA" --notes "Verified Repo Atlas production release $GITHUB_SHA"
          gh release view "repo-atlas-$GITHUB_SHA" --json tagName,targetCommitish,isDraft,isPrerelease,isImmutable,assets > .release/published-release.json
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const view = JSON.parse(await readFile(".release/published-release.json", "utf8"));
          const id = process.env.GITHUB_SHA;
          const expected = ["archive.sha256","deployment-record.json","licenses.json",`repo-atlas-${id}.tar.gz`,"release-manifest.json","sbom.cdx.json","test-summary.json"].sort();
          const names = Array.isArray(view.assets) ? view.assets.map((asset) => asset.name).sort() : [];
          if (view.tagName !== `repo-atlas-${id}` || view.targetCommitish !== id || view.isDraft ||
              view.isPrerelease || view.isImmutable !== true || JSON.stringify(names) !== JSON.stringify(expected))
            throw new Error("published_release_identity_invalid");
          NODE
          gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/repo-atlas-$GITHUB_SHA" > .release/published-tag.json
          node -e "const p=require('./.release/published-tag.json');if(p?.ref!=='refs/tags/repo-atlas-'+process.env.GITHUB_SHA||p?.object?.type!=='commit'||p.object.sha!==process.env.GITHUB_SHA)throw Error('published_tag_ref_mismatch')"
      - id: automatic_rollback
        name: Automatically restore exact starting version
        if: failure() && steps.promote_version.outputs.started == 'true'
        continue-on-error: true
        env:
          ACTIVE_WORKER_VERSION_ID: ${{ steps.previous.outputs.active_worker_version_id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler versions deploy "$ACTIVE_WORKER_VERSION_ID@100%" --yes --message "Automatic rollback after failed $GITHUB_SHA promotion" --env="" --config .release/deploy.jsonc
      - name: Always verify automatic rollback
        if: always() && steps.automatic_rollback.outcome != 'skipped'
        env:
          ACTIVE_WORKER_VERSION_ID: ${{ steps.previous.outputs.active_worker_version_id }}
          AUTOMATIC_ROLLBACK_OUTCOME: ${{ steps.automatic_rollback.outcome }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx wrangler deployments status --json --env="" --config .release/deploy.jsonc > .release/automatic-rollback-status.json
          node -e "const p=require('./.release/automatic-rollback-status.json');if(p?.versions?.length!==1||p.versions[0].version_id!==process.env.ACTIVE_WORKER_VERSION_ID||p.versions[0].percentage!==100)throw Error('automatic_rollback_version_mismatch')"
          STARTING_RELEASE_ID="$(tr -d '\r\n' < .release/starting-release-id)"
          STARTING_RELEASE_ID="$STARTING_RELEASE_ID" node --input-type=module <<'NODE'
          const response = await fetch(`https://${process.env.PRODUCTION_HOST}/health`);
          let body;
          try { body = await response.json(); } catch { body = null; }
          if (response.status !== 200 || body?.status !== "ok" ||
              body?.releaseId !== process.env.STARTING_RELEASE_ID)
            throw new Error("automatic_rollback_health_mismatch");
          NODE
          [[ "$AUTOMATIC_ROLLBACK_OUTCOME" = success ]] || { echo automatic_rollback_command_failed >&2; exit 1; }
