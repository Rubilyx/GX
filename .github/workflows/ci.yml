name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          package-manager-cache: false
      - run: npm ci
      - run: npm run preloads
      - run: git diff --exit-code public/modulepreload.json
      - run: npm run check
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium firefox webkit chrome msedge
      - run: npm run test:e2e
      - name: Record passed gates
        env:
          COMMIT: ${{ github.sha }}
        run: >-
          node -e "const fs=require('node:fs');fs.mkdirSync('artifacts',{recursive:true});fs.writeFileSync('artifacts/test-summary.json',JSON.stringify({commit:process.env.COMMIT,gates:{types:'passed',css:'passed',sourcePolicy:'passed',unit:'passed',integration:'passed',browser:'passed',accessibility:'passed',noJavaScript:'passed'}},null,2)+'\n')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ci-${{ github.sha }}
          path: |
            artifacts
            playwright-report
            test-results
          retention-days: 30
          if-no-files-found: ignore
